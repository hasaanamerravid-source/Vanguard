name: Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.0'

      - name: Build all loaders
        run: gradle :fabric:build :quilt:build :neoforge:build --no-daemon --console=plain

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: vanguard-jars
          if-no-files-found: error
          path: |
            fabric/build/libs/*.jar
            quilt/build/libs/*.jar
            neoforge/build/libs/*.jar
